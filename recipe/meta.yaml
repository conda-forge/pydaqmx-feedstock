{% set name = "pydaqmx" %}
{% set version = "1.4.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 95b0c065bc14f27ea12f8415cd400b870972e659a0d72120627ce5250ac5d161

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=2.7
    - pip
  run:
    - python >=2.7

test:
  commands:
    - pip check
  requires:
    - pip

about:
  home: http://pythonhosted.org/PyDAQmx/
  summary: Interface to the National Instruments PyDAQmx driver
  doc_url: https://pythonhosted.org/PyDAQmx/
  license: BSD-3-Clause
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - untzag
    - ksunden
